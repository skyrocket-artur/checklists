<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Обман или нет? Проверь себя</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0E1110;--card:#161A18;--line:#232926;--tx:#F2F4F3;--mut:#9AA49F;--g:#00D68F;--gd:#07130D;--r:#FF6B6B}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;min-height:100%}
.w{max-width:480px;margin:0 auto;padding:22px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
.k{font:700 12px/1 ui-monospace,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--g);margin-bottom:14px}
h1{font-size:28px;line-height:1.12;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
h1 b,.g{color:var(--g)}
p.s{color:var(--mut);margin-bottom:20px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:16px 18px;font-family:inherit;font-weight:700;font-size:17px;line-height:1.2;cursor:pointer;text-align:center;text-decoration:none}
.pri{background:var(--g);color:var(--gd)}
.sec{background:var(--card);color:var(--tx);border:1px solid var(--line);margin-top:10px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.box h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--g);margin-bottom:8px}
.box li{margin:0 0 6px 18px}
label.f{display:block;font-size:14px;color:var(--mut);margin:12px 0 6px}
input[type=number],input[type=text],select{width:100%;background:#0b0e0d;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:13px 14px;font:600 17px/1.2 inherit;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--g)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1;min-width:70px;background:#0b0e0d;border:1px solid var(--line);color:var(--tx);border-radius:12px;padding:12px 8px;font-family:inherit;font-weight:600;font-size:15px;cursor:pointer}
.seg button.on{border-color:var(--g);background:#0f2a20;color:var(--g)}
.big{font-size:38px;font-weight:800;letter-spacing:-.02em;color:var(--g);margin:6px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{white-space:nowrap}
.note{font-size:12px;color:#6E7A75;margin-top:8px}
.ft{margin-top:auto;padding-top:22px;color:#5E6A65;font-size:12px;text-align:center}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--tx);border-radius:14px;padding:15px 16px;margin-bottom:10px;font-family:inherit;font-weight:500;font-size:16px;line-height:1.35;cursor:pointer}
.opt.ok{border-color:var(--g);background:#0f2a20} .opt.no{border-color:var(--r);background:#2a1414}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--g)}

</style></head><body><div class="w" id="app">
<div id="g"></div><div class="ft">© Артур Юнусов · Skyrocket · Не является инвестиционной рекомендацией</div></div>
<script>
const BOT='https://t.me/YunusovArtur_bot';
const tg=window.Telegram&&Telegram.WebApp;
if(tg){try{tg.ready();tg.expand();tg.setHeaderColor('#0E1110');tg.setBackgroundColor('#0E1110')}catch(e){}}
function go(u){if(tg&&tg.openTelegramLink&&u.startsWith('https://t.me/')){tg.openTelegramLink(u)}else{location.href=u}}
function rub(x){return Math.round(x).toLocaleString('ru-RU').replace(/,/g,' ')+' ₽'}
function share(slug,text){go('https://t.me/share/url?url='+encodeURIComponent(BOT+'?start='+slug)+'&text='+encodeURIComponent(text))}

const S=[
['Звонят из «службы безопасности банка»: с вашего счёта пытаются списать деньги, переведите их на безопасный счёт.',1,'Безопасных счетов не существует. Банк никогда не просит переводить деньги. Клади трубку и звони в банк сам по номеру с карты.'],
['Пришло СМС с кодом. Тут же звонит «оператор» и просит продиктовать код, чтобы отменить подозрительную операцию.',1,'Код из СМС — это твоя подпись. Его не называют никому, даже «сотрудникам банка».'],
['Ты сам открыл приложение брокера из реестра ЦБ и купил ОФЗ на 5 000 ₽.',0,'Всё нормально: ты сам начал действие, через официальное приложение, у лицензированного брокера.'],
['В чате «инвестиций» эксперт гарантирует 5% в день и просит перевести деньги ему на карту «в управление».',1,'Гарантированный высокий доход и перевод на карту человека — два главных признака мошенников.'],
['Звонит «следователь»: нужно помочь поймать преступника, оформив кредит в своём банке, и передать деньги «на хранение».',1,'Полиция и ЦБ не просят брать кредиты и переводить деньги. Это классическая схема.'],
['Ты сам зашёл в приложение Госуслуг и увидел, что налоговая одобрила тебе вычет.',0,'Всё в порядке: ты сам открыл официальное приложение, никто тебе не звонил и ничего не просил.'],
['На P2P продавец просит перевести деньги на карту другого человека и написать в комментарии «подарок».',1,'Перевод на карту третьего лица и странные комментарии — так работают дропы. Сделка может стать проблемой для тебя.'],
['Друг пишет с нового номера: «срочно займи 15 000, потом объясню, звонить не могу».',1,'Скорее всего взломали аккаунт или подделали. Позвони другу на старый номер голосом, прежде чем переводить.'],
['Пришло письмо: «Госуслуги: вам положена компенсация» со ссылкой на gosuslugi-vyplata.ru.',1,'Это поддельный сайт. Настоящий адрес — gosuslugi.ru. Заходи только через приложение или набирай адрес сам.'],
['Брокер в приложении просит пройти тест, прежде чем дать купить сложный инструмент.',0,'Это нормально: по закону брокер тестирует неквалифицированных инвесторов перед сложными сделками.']];
let i=0,ok=0;const g=document.getElementById('g');
function intro(){g.innerHTML='<div class="k">Игра · безопасность</div><h1>Обман <b>или нет?</b></h1><p class="s">10 ситуаций, которые случаются каждый день. Угадай, где мошенники, а где всё в порядке.</p><div class="box"><h3>Зачем</h3><ul><li>Мошенники уводят у россиян сотни миллиардов рублей в год</li><li>Чаще всего — у пожилых родителей</li><li>Пройди сам и отправь родителям</li></ul></div><button class="btn pri" id="st">Начать</button>';document.getElementById('st').onclick=()=>{i=0;ok=0;q()}}
function q(){const s=S[i];g.innerHTML='<div class="k">Ситуация '+(i+1)+' из '+S.length+'</div><div class="bar"><i style="width:'+(i/S.length*100)+'%"></i></div><div class="box" style="font-size:18px;line-height:1.4">'+s[0]+'</div><button class="opt" data-a="1">🚨 Это обман</button><button class="opt" data-a="0">✅ Всё в порядке</button><div id="ex"></div>';
g.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(g.dataset.lock)return;g.dataset.lock=1;const a=+b.dataset.a,right=a===s[1];if(right)ok++;b.classList.add(right?'ok':'no');document.getElementById('ex').innerHTML='<div class="box"><h3>'+(right?'Верно':'Не угадал')+'</h3>'+s[2]+'</div><button class="btn pri" id="nx">'+(i<S.length-1?'Дальше':'Результат')+'</button>';document.getElementById('nx').onclick=()=>{delete g.dataset.lock;i++;i<S.length?q():res()}})}
function res(){const t=ok>=9?['🛡','Мошенникам тебя не взять']:ok>=7?['👀','Внимательный, но есть слабые места']:['⚠️','Тебя могут обмануть'];
g.innerHTML='<div class="k">Результат</div><div class="box" style="text-align:center"><div style="font-size:54px">'+t[0]+'</div><div class="big">'+ok+' из '+S.length+'</div><div style="font-size:20px;font-weight:800">'+t[1]+'</div></div><div class="box"><h3>3 правила на всю жизнь</h3><ul><li>Положи трубку и перезвони в банк сам</li><li>Коды из СМС не называй никому</li><li>Поставь самозапрет на кредиты на Госуслугах</li></ul></div><button class="btn pri" id="sh">Отправить родителям 📲</button><button class="btn sec" id="re">Пройти заново</button><a class="btn sec" href="https://t.me/YunusovArtur">Больше про деньги — в канале</a>';
document.getElementById('sh').onclick=()=>share('obman_share','Проверь себя: 10 ситуаций — где мошенники, а где всё в порядке. Я набрал '+ok+' из 10:');document.getElementById('re').onclick=intro;}
intro();

</script></body></html>
